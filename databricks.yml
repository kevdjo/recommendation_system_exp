# recommendation_system_exp/databricks.yml
#
# Databricks Asset Bundle for recommendation_system_exp.
# Project type: modeling_batch
# Compute type: serverless

bundle:
  name: recommendation_system_exp

include:
  - resources/*.yml

artifacts:
  main_wheel:
    type: whl
    build: uv build --wheel
    path: .

variables:
  catalog:
    description: "UC catalog for this project's writes"
    default: dev_catalog
  schema:
    description: "UC schema for this project (provisioned by infra/platform)"
    default: recommendation_system_exp
  output_db:
    description: "UC schema the legacy mldb.* output tables resolve to"
    default: mldb
  source_db:
    description: "UC schema the legacy dm_analytics.* source tables resolve to"
    default: dm_analytics
  model_name:
    description: "UC registered model name"
    default: recommendation_system_exp_model
  job_pause_status:
    description: "Whether scheduled jobs are active; only prod runs unpaused"
    default: "PAUSED" 
  failure_email:
    description: "Email to notify on job failure."

  # Schedules
  train_cron:
    description: "Cron for train_job"
    default: "0 0 21 3 * ?"
  score_cron:
    description: "Cron for score_job"
    default: "0 0 23 ? * FRI"
  schedule_timezone:
    description: "Timezone for schedules"
    default: "Asia/Jakarta"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-74da1b76-dd4d.cloud.databricks.com/
    run_as:
      user_name: ${workspace.current_user.userName}
    variables:
      catalog: dev_catalog
      # For now dev runs on the dry-run scratch objects (see dry_run/).
      schema: dryrun_mldb
      output_db: dryrun_mldb
      source_db: dryrun_dm_analytics
      failure_email: ${workspace.current_user.userName}

  staging:
    mode: production
    workspace:
      host: https://staging-workspace.cloud.databricks.com
    run_as:
      service_principal_name: svc-dab-staging
    variables:
      catalog: stg_catalog
      failure_email: "<staging-team-alias@your-org.example>"
      job_pause_status: "PAUSED"

  prod:
    mode: production
    workspace:
      host: https://prod-workspace.cloud.databricks.com
    run_as:
      service_principal_name: svc-dab-prod
    variables:
      catalog: prod_catalog
      failure_email: "<prod-oncall@your-org.example>"
      job_pause_status: "UNPAUSED"
