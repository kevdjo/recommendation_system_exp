[project]
name = "recommendation-system-exp"
version = "0.1.0"
description = "Banking product recommendation batch use case (CDSW to Databricks Serverless migration)"
readme = "README.md"
requires-python = ">=3.12"
# pyspark is intentionally NOT a runtime dependency: Databricks Serverless
# provides its own Spark Connect client, and pip-installing open-source
# pyspark over it can break the session. It is in the dev group for local use.
dependencies = [
    "pyyaml>=6.0.3",
    "pydantic>=2",
    "pandas",
    "numpy",
    "python-dateutil",
]

[project.scripts]
me_rec_runner = "recommendation_system_exp.runner:run"

[dependency-groups]
dev = [
    "databricks-connect>=19.3.0",
    "ipykernel>=7.4.0",
    "pyspark>=4.2.1",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recommendation_system_exp"]
