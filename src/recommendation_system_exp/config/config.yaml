# Project-level config.
project_name: recommendation_system_exp

core:
  # Migration: root for all persisted Spark ML artifacts, dictionaries and the
  # cross-task config state file (overridable via runner --artifact_root).
  artifact_root: "/Volumes/dev_catalog/recommendation_system_exp/artifacts"
  today: "2026-05-15"
  data_retention: 2
  day: 2
  is_training_date: false

customer_data_preprocessing:
  cust_used_cols:
    - cif_number
    - cif_creation_date
    - zip_code_tinggal
    - marital_status
    - income_level
    - gender
    - job_desc
    - flag_mobi
    - cif_syariah
  dpk_used_cols:
    - report_date
    - cif_number
    - account_number
    - account_open_date
    - idr_balance_amount
  occupation_fpath: "${artifact_root}/reference/occupation.csv"
  zip_code_fpath: "${artifact_root}/reference/kode_pos.csv"
  bl_zip_code:
    - "12345"
    - "11111"
    - "22222"
    - "33333"
    - "44444"
    - "55555"
    - "66666"
    - "77777"
    - "88888"
    - "99999"
    - "00000"
    - "54321"
  reksa_used_cols:
    - report_date
    - cif
    - ifua
    - holding_date
    - nilai_tunai_idr
  banca_used_cols:
    - report_date
    - cif_number_by_disburse_account
    - policy_no
    - pinbook_date
    - aum_idr
  marital_status:
    - widow
    - divorced
    - widower
    - separated
    - de facto (common law)
  income_level:
    - 4
    - 5
    - 6
    - 7

product_data_preprocessing:
  product_list_fpath: "${artifact_root}/reference/product_list.csv"
  pl_used_cols:
    - product_group
    - biu
    - detail_product
    - product_name_on_data
  dpk_used_cols:
    - report_date
    - cif_number
    - account_number
    - account_open_date
    - category_group
    - category_desc
    - currency
  banca_used_cols:
    - report_date
    - cif_number_by_disburse_account
    - policy_no
    - product_name
    - pinbook_date
  cport_used_cols:
    - report_date
    - cif_number
    - loc_acct
    - cncl_dt
  ccard_used_cols:
    - loc_acct
    - pgm_desc
    - card_anv_dt
    - card_type
  loan_used_cols:
    - report_date
    - cif
    - contract_no
    - tanggal_awal
    - type_of_financing
    - fasilitas_kredit
  reksa_used_cols:
    - report_date
    - cif
    - ifua
    - holding_date
    - category_name
    - jumlah_unit

rfm_data_preprocessing:
  transaction_cols:
    - ft_number
    - sender_cif
    - receiver_cif
    - amount
    - transaction_real_date
    - type_transaction_desc
  em_transaction_cols:
    - transaction_number
    - status
    - transaction_date
    - debit_account
    - credit_account
    - currency
    - transaction_amount
    - charge_amount

model_selection:
  used_model:
    - GBTClassifier
    - RandomForestClassifier
    - DecisionTreeClassifier

# Restored from the previous commit (simobi -> mobi).
# Artifact keys (training_date, fe_fpath, model_fpath, *_bucketizer_fpath,
# binarizer_fpath, customer_preprocessing_fpath, clustering_model_fpath,
# mobi_preprocessing_fpath, mobi_model_fpath) are deliberately NOT set here:
#   - when absent, support_function.getConfig falls back to the latest artifact
#     under core.artifact_root (legacy behaviour);
#   - model_comparison() (training step 08) persists training_date and the
#     chosen paths into the state file, which inference reads.
# To pin a specific training run, set them here or in the state file.
prediction:
  experimentation_fpath: "${artifact_root}/reference/experimentation.csv"

post_processing:
  tnc_fpath: "${artifact_root}/hard_rules/term_and_condition.csv"
  product_exclution_fpath: "${artifact_root}/hard_rules/product_exclution.csv"
